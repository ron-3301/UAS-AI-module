# MQTT broker config for UAS AI Module
# See docs/13_data_schemas.md §3 for topic structure.

listener 1883 0.0.0.0
protocol mqtt

# Authentication
allow_anonymous false
password_file /mosquitto/config/passwd

# ACLs - the AI module is publish-only on its own subtree.
acl_file /mosquitto/config/acl

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_type warning
log_type error
log_type notice
connection_messages true
