version: "1.0"

# ------------------------------------------------------------------
# Model artefacts
# ------------------------------------------------------------------
model:
  detection_weights:        models/exports/yolov8m_uas_v1.engine
  detection_input_size:     640
  detection_conf_threshold: 0.45
  detection_iou_threshold:  0.45
  classifier_weights:       models/exports/efficientnet_b3_id_v1.engine
  classifier_input_size:    224
  classifier_topk:          3

# ------------------------------------------------------------------
# Sensor & calibration
# ------------------------------------------------------------------
sensor:
  modality:          EO              # [EO | IR]
  source:            "rtsp://127.0.0.1:8554/camera"
  calibration_file:  configs/cam01_intrinsics.yaml

# ------------------------------------------------------------------
# Telemetry
# ------------------------------------------------------------------
telemetry:
  source:        mavlink
  udp_port:      14550
  max_stale_ms:  1000              # tolerate this much missing data

# ------------------------------------------------------------------
# Geolocation
# ------------------------------------------------------------------
geolocation:
  terrain_model:        flat_earth   # [flat_earth | dted1 | dted2]
  dted_path:            null
  vo_fallback_enabled:  true
  vo_max_seconds:       60          # after this, validity_flag=false

# ------------------------------------------------------------------
# Output
# ------------------------------------------------------------------
output:
  json_socket_addr:   "192.168.1.255"
  json_socket_port:   5005
  rtsp_port:          8554
  health_port:        8080
  mqtt_broker:        "192.168.1.1"
  mqtt_port:          1883
  mqtt_uas_id:        "uas-001"
  sqlite_path:        "logs/missions/"

# ------------------------------------------------------------------
# Mission profile (selects pre-baked latency profile from doc 14 §2)
# ------------------------------------------------------------------
mission_profile: tracking          # [wide_area | tracking | point_targeting]

# ------------------------------------------------------------------
# Jetson runtime tuning (doc 14 §3)
# ------------------------------------------------------------------
jetson:
  power_mode:        "25W"          # [MAXN | 25W | 15W | 10W]
  pin_inference_cpus: [4, 5, 6, 7]

# ------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------
log_level: INFO                     # [DEBUG | INFO | WARNING | ERROR]
log_dir:   logs/
