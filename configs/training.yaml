version: "1.0"

dataset:
  root:           data/processed/current
  splits:         { train: 0.8, val: 0.1, test: 0.1 }
  stratify_by:    class
  image_size:     640
  cache:          ram                  # [ram | disk | none]

detector:
  arch:           yolov8m
  pretrained:     yolov8m.pt
  epochs:         300
  batch_size:     16
  optimiser:      SGD
  lr0:            0.01
  lrf:            0.01
  momentum:       0.937
  weight_decay:   0.0005
  warmup_epochs:  3
  patience:       50                   # early stop

classifier:
  arch:           efficientnet_b3
  pretrained:     imagenet
  epochs:         60
  batch_size:     64
  optimiser:      AdamW
  lr:             0.0003
  weight_decay:   0.05
  label_smoothing: 0.1
  mixup_alpha:    0.2

augmentation:                          # mirrors doc 4 §3 exactly
  random_resized_crop:      { p: 0.8, scale: [0.6, 1.0] }
  horizontal_flip:          { p: 0.5 }
  vertical_flip:            { p: 0.3 }
  rotate:                   { p: 0.7, limit_deg: 15 }
  hsv:                      { p: 0.6, h: 10, s: 30, v: 20 }
  gauss_noise:              { p: 0.4, var_limit: [10, 50] }
  coarse_dropout:           { p: 0.3, max_holes: 8, max_h_frac: 0.1, max_w_frac: 0.1 }

experiment:
  tracker:        mlflow
  tracking_uri:   "http://localhost:5000"
  seed:           1337
