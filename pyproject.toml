[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uas-ai-module"
version = "0.1.0"
description = "Safety-first advisory UAS perception module rebuild"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "uas-ai-module maintainers" }]
dependencies = [
  "numpy>=1.24",
  "jsonschema>=4.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "mypy>=1.0",
]

[project.scripts]
uas-ai-module = "uas_ai_module.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
